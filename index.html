<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>PathForge — Engineering & Technology Roadmaps</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --s: #fff;
            --s2: #eef1f4;
            --t: #202631;
            --m: #687586;
            --b: #dfe3e8;
            --a: #315b82;
            --a2: #e8eff5;
            --r: 10px
        }

        body.dark {
            --bg: #15191f;
            --s: #1e242c;
            --s2: #282f39;
            --t: #e8edf2;
            --m: #a5afbb;
            --b: #373f4a;
            --a: #91b5d7;
            --a2: #293746
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font: 15px/1.55 system-ui, Segoe UI, sans-serif
        }

        button,
        input,
        select {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid #79a9d2;
            outline-offset: 2px
        }

        .shell {
            max-width: 1240px;
            margin: auto;
            padding: 0 26px
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--s);
            border-bottom: 1px solid var(--b)
        }

        .bar {
            height: 66px;
            display: flex;
            align-items: center;
            gap: 20px
        }

        .brand {
            display: flex;
            gap: 10px;
            align-items: center;
            text-decoration: none;
            color: var(--t);
            min-width: 210px
        }

        .mark {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            background: var(--a);
            color: #fff;
            border-radius: 9px;
            font-weight: 800
        }

        .brand small {
            display: block;
            color: var(--m);
            font-size: 10px;
            margin-top: -4px
        }

        .search {
            position: relative;
            flex: 1;
            max-width: 460px
        }

        .search input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--b);
            border-radius: 9px;
            padding: 10px 12px 10px 36px
        }

        .glass {
            position: absolute;
            left: 12px;
            top: 7px;
            color: var(--m)
        }

        nav {
            margin-left: auto;
            display: flex;
            gap: 4px
        }

        nav button,
        .icon,
        .menu {
            border: 0;
            background: transparent;
            padding: 9px 11px;
            border-radius: 8px;
            color: var(--m)
        }

        nav button:hover,
        .icon:hover,
        .menu:hover {
            background: var(--s2);
            color: var(--t)
        }

        .menu {
            display: none
        }

        .suggest {
            position: absolute;
            z-index: 40;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: var(--s);
            border: 1px solid var(--b);
            border-radius: 9px;
            box-shadow: 0 8px 25px #0002;
            overflow: hidden
        }

        .suggest button {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: none;
            padding: 10px 13px
        }

        .suggest button:hover {
            background: var(--s2)
        }

        .suggest small {
            display: block;
            color: var(--m)
        }

        .hidden {
            display: none !important
        }

        main {
            min-height: 68vh
        }

        .hero {
            padding: 52px 0 24px
        }

        .eyebrow {
            color: var(--a);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .1em
        }

        .hero h1 {
            font-size: clamp(35px, 5vw, 54px);
            line-height: 1.08;
            letter-spacing: -1.5px;
            margin: 8px 0
        }

        .hero p,
        .desc {
            color: var(--m)
        }

        .hero p {
            font-size: 17px
        }

        .hero .search {
            max-width: 680px
        }

        .hero input {
            font-size: 16px;
            padding: 14px 14px 14px 40px;
            background: var(--s)
        }

        .stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            color: var(--m);
            font-size: 13px;
            margin-top: 20px
        }

        .stats b {
            color: var(--t);
            font-size: 15px
        }

        .section {
            padding: 24px 0
        }

        .sh {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 12px;
            margin-bottom: 15px
        }

        .sh h2,
        .title {
            font-size: 23px;
            letter-spacing: -.5px;
            margin: 0
        }

        .sh p {
            margin: 3px 0;
            color: var(--m)
        }

        .link {
            border: 0;
            background: none;
            color: var(--a);
            font-weight: 650
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 13px
        }

        .field,
        .card,
        .panel,
        .continue {
            background: var(--s);
            border: 1px solid var(--b);
            border-radius: var(--r)
        }

        .field {
            padding: 15px;
            text-align: left;
            min-height: 90px
        }

        .field:hover,
        .card:hover {
            border-color: var(--a)
        }

        .field strong,
        .field small {
            display: block
        }

        .field small {
            color: var(--m)
        }

        .field em {
            font-style: normal;
            font-size: 19px
        }

        .card {
            padding: 15px;
            min-height: 205px;
            display: flex;
            flex-direction: column
        }

        .top {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .ico {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            background: var(--s2);
            border-radius: 8px
        }

        .pill {
            background: var(--s2);
            border-radius: 99px;
            padding: 3px 8px;
            font-size: 11px;
            color: var(--m)
        }

        .bookmark {
            margin-left: auto;
            border: 0;
            background: none;
            color: var(--a);
            font-size: 18px
        }

        .card h3 {
            font-size: 15px;
            line-height: 1.3;
            margin: 12px 0 5px
        }

        .card p {
            font-size: 12px;
            color: var(--m);
            margin: 0
        }

        .meta {
            margin-top: auto;
            padding-top: 11px;
            font-size: 11px;
            color: var(--m)
        }

        .line {
            height: 5px;
            background: var(--s2);
            border-radius: 5px;
            overflow: hidden;
            margin: 9px 0
        }

        .line i {
            display: block;
            height: 100%;
            background: var(--a)
        }

        .actions {
            display: flex;
            gap: 7px;
            align-items: center;
            margin-top: 10px
        }

        .btn {
            background: var(--s);
            border: 1px solid var(--b);
            border-radius: 8px;
            padding: 8px 11px;
            font-size: 12px;
            font-weight: 650
        }

        .btn.primary {
            background: var(--a);
            border-color: var(--a);
            color: #fff
        }

        .btn:hover {
            border-color: var(--a)
        }

        .chips {
            display: flex;
            gap: 7px;
            overflow: auto;
            margin: 15px 0
        }

        .chip {
            border: 1px solid var(--b);
            background: var(--s);
            border-radius: 99px;
            padding: 7px 11px;
            font-size: 12px;
            white-space: nowrap
        }

        .chip.active {
            background: var(--a);
            border-color: var(--a);
            color: white
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 18px 0
        }

        .filters select,
        .filters input {
            border: 1px solid var(--b);
            border-radius: 8px;
            background: var(--s);
            padding: 9px 11px
        }

        .filters .search {
            min-width: 220px
        }

        .page {
            padding: 28px 0 54px
        }

        .crumb {
            font-size: 12px;
            color: var(--m);
            margin-bottom: 15px
        }

        .crumb button {
            border: 0;
            background: none;
            color: var(--a);
            padding: 0
        }

        .roadhead {
            display: flex;
            justify-content: space-between;
            gap: 15px
        }

        .roadhead h1 {
            font-size: 31px;
            letter-spacing: -.8px;
            margin: 5px 0
        }

        .roadhead p {
            color: var(--m);
            max-width: 780px;
            margin: 5px 0
        }

        .actions.right {
            justify-content: flex-end;
            flex-wrap: wrap
        }

        .summary {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            border-block: 1px solid var(--b);
            padding: 13px 0;
            margin: 14px 0
        }

        .summary .line {
            width: 150px;
            margin: 0
        }

        .tabs {
            display: flex;
            gap: 5px;
            border-bottom: 1px solid var(--b);
            overflow: auto;
            margin: 20px 0
        }

        .tab {
            border: 0;
            border-bottom: 2px solid transparent;
            background: none;
            color: var(--m);
            padding: 10px 12px;
            white-space: nowrap
        }

        .tab.active {
            border-color: var(--a);
            color: var(--a);
            font-weight: 700
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 235px;
            gap: 22px
        }

        .tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 13px
        }

        .tools input {
            flex: 1;
            min-width: 160px;
            border: 1px solid var(--b);
            border-radius: 8px;
            background: var(--s);
            padding: 8px
        }

        .stage {
            border: 1px solid var(--b);
            background: var(--s);
            border-radius: 9px;
            margin: 12px 0;
            overflow: hidden
        }

        .stagehead {
            background: var(--s2);
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 12px
        }

        .stagehead small {
            display: block;
            color: var(--m)
        }

        .num {
            font-size: 12px;
            font-weight: bold;
            color: var(--a)
        }

        .meter {
            margin-left: auto;
            color: var(--m);
            font-size: 11px;
            white-space: nowrap
        }

        .stagehead button {
            border: 0;
            background: none
        }

        .topics {
            padding: 2px 14px 8px
        }

        .topic {
            display: grid;
            grid-template-columns: 23px 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--b)
        }

        .topic:last-child {
            border: 0
        }

        .topic input {
            accent-color: var(--a);
            width: 18px;
            height: 18px
        }

        .topic b {
            font-size: 13px
        }

        .topic small {
            display: block;
            color: var(--m);
            font-size: 11px
        }

        .topic aside {
            display: flex;
            gap: 4px;
            align-items: center
        }

        .topic aside button {
            border: 0;
            background: none;
            color: var(--a)
        }

        .side {
            position: sticky;
            top: 85px;
            align-self: start
        }

        .panel {
            padding: 15px;
            margin-bottom: 11px
        }

        .panel h3 {
            font-size: 14px;
            margin: 0 0 8px
        }

        .panel p,
        .panel li {
            font-size: 12px;
            color: var(--m)
        }

        .panel ul {
            padding-left: 18px
        }

        .empty {
            border: 1px dashed var(--b);
            border-radius: 10px;
            padding: 32px;
            text-align: center;
            color: var(--m);
            background: var(--s)
        }

        .continue {
            padding: 14px
        }

        .continue h3 {
            font-size: 14px;
            margin: 0
        }

        .continue small {
            color: var(--m)
        }

        .continuegrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: #11182780;
            z-index: 60;
            display: flex;
            justify-content: flex-end
        }

        .drawer {
            width: min(500px, 100%);
            background: var(--s);
            padding: 24px;
            overflow: auto
        }

        .drawerhead {
            display: flex;
            justify-content: space-between
        }

        .drawer h2 {
            margin: 8px 0
        }

        .close {
            border: 0;
            border-radius: 50%;
            width: 35px;
            height: 35px
        }

        .toast {
            position: fixed;
            z-index: 80;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #202631;
            color: white;
            border-radius: 8px;
            padding: 10px 15px
        }

        .footer {
            border-top: 1px solid var(--b);
            padding: 23px 0;
            color: var(--m);
            font-size: 12px
        }

        .footerrow {
            display: flex;
            justify-content: space-between;
            gap: 15px
        }

        .mobile {
            display: none
        }

        .project {
            padding: 13px 0;
            border-bottom: 1px solid var(--b)
        }

        .plan {
            border: 1px solid var(--b);
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0
        }

        .tablewrap {
            overflow: auto
        }

        table {
            border-collapse: collapse;
            min-width: 600px;
            width: 100%
        }

        td,
        th {
            border: 1px solid var(--b);
            padding: 9px;
            text-align: left;
            vertical-align: top
        }

        @media(max-width:930px) {
            .grid {
                grid-template-columns: repeat(3, 1fr)
            }

            .layout {
                grid-template-columns: 1fr
            }

            .side {
                position: static;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 9px
            }

            .side .panel {
                margin: 0
            }
        }

        @media(max-width:680px) {
            .shell {
                padding: 0 15px
            }

            .bar {
                height: 57px;
                gap: 8px
            }

            .brand {
                min-width: 0
            }

            .brand small {
                display: none
            }

            .search.global,
            nav {
                display: none
            }

            .mobile {
                display: none;
                position: absolute;
                top: 57px;
                left: 0;
                right: 0;
                background: var(--s);
                padding: 10px 16px;
                border-bottom: 1px solid var(--b)
            }

            .mobile.open {
                display: grid
            }

            .mobile button {
                text-align: left;
                padding: 10px;
                border: 0;
                background: none
            }

            .menu {
                display: block;
                margin-left: auto
            }

            .hero {
                padding: 34px 0 18px
            }

            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 9px
            }

            .field,
            .card {
                padding: 12px
            }

            .card {
                min-height: 215px
            }

            .card h3 {
                font-size: 14px
            }

            .section {
                padding: 18px 0
            }

            .sh h2,
            .title {
                font-size: 20px
            }

            .roadhead {
                display: block
            }

            .roadhead h1 {
                font-size: 27px
            }

            .actions.right {
                justify-content: flex-start;
                margin-top: 12px
            }

            .summary {
                gap: 10px
            }

            .summary .line {
                width: 110px
            }

            .side {
                grid-template-columns: 1fr
            }

            .continuegrid {
                grid-template-columns: 1fr
            }

            .stagehead {
                padding: 10px
            }

            .topics {
                padding: 2px 10px
            }

            .topic {
                gap: 6px
            }

            .topic aside .pill {
                display: none
            }

            .footerrow {
                display: block
            }

            .footerrow>div {
                margin: 7px 0
            }
        }

        @media(max-width:370px) {
            .shell {
                padding: 0 11px
            }

            .grid {
                grid-template-columns: 1fr
            }

            .card {
                min-height: unset
            }

            .hero h1 {
                font-size: 34px
            }
        }

        @media print {

            .header,
            .footer,
            .actions,
            .tabs,
            .tools,
            .side,
            .bookmark,
            .topic input,
            .stagehead button {
                display: none !important
            }

            body {
                background: white;
                color: #111
            }

            .shell {
                max-width: none;
                padding: 0
            }

            .layout {
                display: block
            }

            .stage {
                break-inside: avoid
            }

            .topics {
                display: block !important
            }

            .stagehead {
                background: #eee
            }
        }

        /* PathForge focused workspace redesign */
        :root {
            --bg: #FAFAF9;
            --s: #FFFFFF;
            --s2: #F4F4F2;
            --t: #18181B;
            --m: #6B7280;
            --faint: #9CA3AF;
            --b: #E7E5E4;
            --a: #4F46E5;
            --a2: #EEF0FF;
            --good: #16A34A;
            --goodsoft: #E8F7EE;
            --warn: #D97706;
            --warnsoft: #FEF3E2;
            --r: 16px
        }

        body.dark {
            --bg: #0B0D12;
            --s: #12151C;
            --s2: #181C25;
            --b: #232834;
            --t: #E8EAF0;
            --m: #9AA3B2;
            --faint: #727d8d;
            --a: #8B93FF;
            --a2: #252744;
            --good: #4ADE80;
            --goodsoft: #193125;
            --warn: #FBBF24;
            --warnsoft: #382c17
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
            line-height: 1.55;
            letter-spacing: -.005em;
            transition: background .18s, color .18s
        }

        h1,
        h2,
        h3 {
            letter-spacing: -.02em
        }

        .workspace-side {
            position: fixed;
            z-index: 35;
            inset: 0 auto 0 0;
            width: 264px;
            background: var(--s);
            border-right: 1px solid var(--b);
            display: flex;
            flex-direction: column;
            padding: 17px 12px;
            transition: width .18s;
            overflow: hidden
        }

        .side-brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3px 19px
        }

        .side-brand .brand {
            min-width: 0
        }

        .side-brand .brand small {
            display: none
        }

        .side-brand .mark {
            background: var(--a);
            border-radius: 10px
        }

        .icon-btn {
            border: 0;
            background: transparent;
            border-radius: 9px;
            width: 36px;
            height: 36px;
            color: var(--m)
        }

        .side-nav {
            overflow: auto;
            flex: 1
        }

        .side-label {
            font-size: 10px;
            letter-spacing: .12em;
            font-weight: 750;
            color: var(--faint);
            padding: 13px 10px 7px
        }

        .side-nav>button,
        .side-fields button,
        .side-bottom button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 11px;
            text-align: left;
            border: 0;
            background: transparent;
            border-radius: 9px;
            min-height: 38px;
            padding: 7px 11px;
            color: var(--m);
            font-size: 13px;
            position: relative
        }

        .side-nav>button i,
        .side-bottom i,
        .bottom-tabs svg {
            width: 18px;
            height: 18px;
            display: inline-flex
        }

        .side-nav>button:hover,
        .side-fields button:hover,
        .side-bottom button:hover {
            background: var(--s2);
            color: var(--t)
        }

        .side-nav>button.active {
            background: var(--a2);
            color: var(--a);
            font-weight: 650
        }

        .side-nav>button.active:before {
            content: "";
            position: absolute;
            left: -11px;
            top: 7px;
            bottom: 7px;
            width: 3px;
            background: var(--a);
            border-radius: 0 3px 3px 0
        }

        .field-label {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .field-label button {
            width: 24px;
            min-height: 24px;
            justify-content: center;
            padding: 0
        }

        .side-fields button {
            min-height: 33px;
            font-size: 12px;
            padding: 5px 10px
        }

        .side-fields button i {
            width: 17px;
            height: 17px
        }

        .side-fields button small {
            margin-left: auto;
            color: var(--faint)
        }

        .side-bottom {
            border-top: 1px solid var(--b);
            padding-top: 8px
        }

        .side-bottom button {
            min-height: 36px
        }

        .workspace {
            margin-left: 264px;
            min-height: 100dvh;
            transition: margin .18s
        }

        .workspace.collapsed {
            margin-left: 72px
        }

        .workspace-side.collapsed {
            width: 72px
        }

        .workspace-side.collapsed .brand span:not(.mark),
        .workspace-side.collapsed .side-nav button span,
        .workspace-side.collapsed .side-label,
        .workspace-side.collapsed .side-bottom button span,
        .workspace-side.collapsed .side-fields {
            display: none
        }

        .workspace-side.collapsed .side-nav>button,
        .workspace-side.collapsed .side-bottom button {
            justify-content: center;
            font-size: 0
        }

        .utility {
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 25;
            background: color-mix(in srgb, var(--bg) 91%, transparent);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;

        /* Precision design system: square geometry, shared borders, compact copy */
        :root {
            --bg: #FAFAF9;
            --s: #FFFFFF;
            --s2: #F4F4F2;
            --s3: #ECECE9;
            --t: #18181B;
            --m: #52525B;
            --faint: #8A8A93;
            --b: #D4D4D8;
            --strong: #A1A1AA;
            --a: #4F46E5;
            --a2: #EEF0FF;
            --good: #16A34A;
            --goodsoft: #E8F7EE;
            --warn: #D97706;
            --warnsoft: #FEF3E2;
            --r: 0px
        }

        body.dark {
            --bg: #0B0D12;
            --s: #12151C;
            --s2: #181C25;
            --s3: #1F2430;
            --b: #2E3544;
            --strong: #4A5368;
            --t: #E8EAF0;
            --m: #A0A9B8;
            --faint: #737d8e;
            --a: #8B93FF;
            --a2: rgba(139, 147, 255, .12);
            --good: #4ADE80;
            --goodsoft: #13291d;
            --warn: #FBBF24;
            --warnsoft: #332913
        }

        *,
        *::before,
        *::after {
            border-radius: 0 !important
        }

        body {
            background: var(--bg);
            color: var(--t);
            text-wrap: pretty;
            letter-spacing: 0;
            transition: background .18s, color .18s
        }

        body.dark .panel,
        body.dark .card,
        body.dark .continue,
        body.dark .stage,
        body.dark .palette,
        body.dark .drawer {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04)
        }

        h1,
        h2,
        h3,
        .title {
            letter-spacing: -.02em;
            text-wrap: balance
        }

        p {
            max-width: 65ch
        }

        .workspace-side {
            background: var(--s);
            border-right: 1px solid var(--b)
        }

        .side-nav>button.active {
            border: 1px solid var(--a);
            border-left: 3px solid var(--a);
            background: var(--a2)
        }

        .side-nav>button.active:before {
            display: none
        }

        .side-nav>button,
        .side-fields button,
        .side-bottom button,
        .icon-btn,
        .btn,
        .chip,
        .field,
        .card,
        .panel,
        .continue,
        .stage,
        .palette,
        .drawer,
        .dialog,
        .settings-pop,
        .command-trigger,
        .mobile-top button,
        .bottom-tabs button,
        .toast,
        .topic,
        .topic-row,
        .tab {
            border-radius: 0 !important;
            box-shadow: none
        }

        .workspace-side button,
        .bottom-tabs button {
            transition: background .16s cubic-bezier(.2, .8, .2, 1), color .16s, transform .16s
        }

        .workspace-side button:active,
        .bottom-tabs button:active,
        .btn:active,
        .field:active {
            transform: scale(.98)
        }

        .utility {
            background: var(--bg);
            border-bottom: 1px solid var(--b);
            backdrop-filter: none
        }

        .command-trigger {
            border: 1px solid var(--b);
            background: var(--s);
            width: min(560px, 54vw)
        }

        .command-trigger:hover,
        .btn:hover,
        .chip:hover {
            border-color: var(--strong)

        .btn {
            border: 1px solid var(--b);
            background: var(--s);
            padding: 8px 12px;
            min-height: 38px;
            font-size: 13px

        .btn.primary {
            border-color: var(--a);
            background: var(--a);
            color: #fff

            outline: 2px solid var(--a);

        .pill,
        .chip,
        .tab,
        .stage,
        .card,
        .panel,
        .continue,
        .field,
        .filters input,
        .filters select,
        .road-tools input,

        .topic input,

        .pill {

            color: var(--m);

        .card,

        .grid {

            function homePage() { let started = roads.filter(r => done(r).length), recent = S.recent.map(get).filter(Boolean), recommend = ['computer-science-fundamentals', 'frontend-developer', 'data-structures-algorithms', 'ai-engineer', 'civil-engineering-fundamentals', 'electrical-engineering-fundamentals', 'electronics-engineering-fundamentals', 'mechanical-engineering-fundamentals', 'cybersecurity-fundamentals', 'power-systems', 'embedded-systems', 'vlsi'].map(get).filter(Boolean); return `<div class="shell"><section class="hero"><div class="eyebrow">Learn with direction</div><h1>Build Your Learning Path</h1><p>Step-by-step roadmaps for engineering, technology, software and career skills.</p><div class="search"><span class="glass">${svgIcon('search', 19)}</span><input id="heroQ" placeholder="What do you want to learn? Try Python, Civil, VLSI…" aria-label="Search roadmaps"><div class="suggest hidden" id="heroS"></div></div><div class="stats"><span><b>${roads.length}+</b> Roadmaps</span><span><b>${fields.length}</b> Engineering fields</span><span><b>Beginner → Advanced</b></span><span><b>Local</b> progress saved</span></div></section>${started.length ? `<section class="section"><div class="sh"><h2>Continue Learning</h2><button class="link" data-go="progress">View progress →</button></div><div class="continuegrid">${started.slice(0, 3).map(r => `<div class="continue"><h3>${esc(r.title)}</h3><small>${percent(r)}% · ${counts(r)[0]}/${counts(r)[1]} topics</small><div class="line"><i style="width:${percent(r)}%"></i></div><button class="btn" data-open="${r.id}">Continue</button></div>`).join('')}</div></section>` : ''}<section class="section"><div class="sh"><div><h2>Explore by Field</h2><p>Start with the area you’re curious about.</p></div><button class="link" data-go="roadmaps">All roadmaps →</button></div><div class="grid">${fields.map(([n, ic]) => `<button class="field" data-cat="${esc(n)}"><span class="field-icon">${svgIcon(ic, 24)}</span><strong>${esc(n)}</stro             function comparePage() { let list = S.compare.map(get).filter(Boolean); return `<div class="shell page"><h1 class="title">Compare Roadmaps</h1><p class="desc">Compare focus, prerequisites, tools, projects and outcomes.</p><div class="filters"><select id="compareAdd"><option value="">Add a roadmap…</option>${roads.filter(r => !S.compare.includes(r.id)).map(r => `<option value="${r.id}">${esc(r.title)}</option>`).join('')}</select><button class="btn" id="compareClear">Clear</button></div>${list.length ? `<div class="tablewrap"><table><tr><th>Dimension</th>${list.map(r => `<th>${esc(r.title)} <button class="link" data-rcompare="${r.id}">×</button></th>`).join('')}</tr>${[['Focus', r => r.description], ['Prerequisites', r => r.prerequisites.join(', ')], ['Major skills', r => r.stages.slice(1, 5).map(s => s.title).join(', ')], ['Tools', r => r.tools.slice(0, 4).map(t => t.name).join(', ')], ['Project types', r => r.projects.map(p => p.difficulty + ': ' + p.title).join('; ')], ['Careers', r => r.careerOutcomes.join(', ')]].map(([x, f]) => `<tr><th>${x}</th>${list.map(r => `<td>${esc(f(r))}</td>`).join('')}</tr>`).join('')}</table></div>` : '<div class="empty">Use Compare on roadmap cards to select up to three paths.</div>'}</div>` } function notfound() { return `<div class="shell page"><div class="empty"><h2>Roadmap not found</h2><p>That path may have moved or the link is incomplete.</p><button class="btn primary" data-go="roadmaps">Explore Roadmaps</button></div></div>` }
            function toggleRoad(id) { let had = S.book.roads.includes(id); S.book.roads = had ? S.book.roads.filter(x => x !== id) : [...S.book.roads, id]; save(); log(`${had ? 'Removed bookmark' : 'Bookmarked'} ${get(id)?.title || 'roadmap'}`); toast(had ? 'Bookmark removed' : 'Roadmap bookmarked'); render() } function toggleBookTopic(key) { S.book.topics = S.book.topics.includes(key) ? S.book.topics.filter(x => x !== key) : [...S.book.topics, key]; save(); toast('Topic bookmarks updated'); render() }
            function toggleTopic(key, checked) { let [rid, tid] = key.split('|'), r = get(rid), t = r?.stages.flatMap(s => s.topics).find(x => x.id === tid); if (!r || !t) return; S.progress[rid] = checked ? [...new Set([...done(r), tid])] : done(r).filter(x => x !== tid); save(); log(`${checked ? 'Completed' : 'Reopened'} ${t.title} — ${r.title}`); toast(checked ? 'Topic completed' : 'Progress updated'); render() }
            function showInfo(key) { let [r, t] = roadmapByTopic(key); if (!t) return; document.querySelector('#overlay').innerHTML = `<div class="overlay" data-dismiss><section class="drawer" role="dialog" aria-modal="true"><div class="drawerhead"><div><span class="pill">${t.importance} · ${t.difficulty}</span><h2>${esc(t.title)}</h2><small>${esc(r.title)}</small></div><button class="close" data-dismiss aria-label="Close">×</button></div><h3>What</h3><p>${esc(t.description)}</p><h3>Why</h3><p>This concept supports sound decisions and practical work in ${esc(r.title)}.</p><h3>Key concepts</h3><ul>${t.keyPoints.map(x => `<li>${esc(x)}</li>`).join('')}</ul><h3>Practice</h3><ul>${t.practice.map(x => `<li>${esc(x)}</li>`).join('')}</ul><div class="actions"><button class="btn primary" data-modalDone="${key}">${done(r).includes(t.id) ? 'Mark Incomplete' : 'Mark Complete'}</button><button class="btn" data-bt="${key}">Save topic</button></div></section></div>`; document.body.style.overflow = 'hidden' } function closeOverlay() { document.querySelector('#overlay').innerHTML = ''; document.body.style.overflow = '' }
            function wireSearch(iid, sid) { let inp = document.getElementById(iid), box = document.getElementById(sid); if (!inp || !box) return; function update() { let q = inp.value.toLowerCase().trim(); if (!q) { box.classList.add('hidden'); return } let found = roads.filter(r => [r.title, r.category, r.description, ...r.aliases].join(' ').toLowerCase().includes(q)).slice(0, 8); box.innerHTML = found.length ? found.map(r => `<button data-open="${r.id}"><b>${esc(r.title)}</b><small>${esc(r.category)} · ${esc(r.description)}</small></button>`).join('') : '<button disabled>No matching roadmaps</button>'; box.classList.remove('hidden') } inp.addEventListener('input', update); inp.addEventListener('keydown', e => { if (e.key === 'Escape') box.classList.add('hidden'); if (e.key === 'Enter') { let r = roads.find(r => (r.title + ' ' + r.category + ' ' + r.aliases.join(' ')).toLowerCase().includes(inp.value.toLowerCase())); if (r) open(r.id) } }) }
            function open(id) { let r = get(id); if (!r) return; S.tab = 'Roadmap'; S.q = ''; go('roadmap/' + id); log('Opened ' + r.title) }
            function wire() {
                wireSearch('globalQ', 'globalS'); wireSearch('heroQ', 'heroS'); document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go)); document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { if (b.dataset.opentab) S.tab = b.dataset.opentab; open(b.dataset.open) }); document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { S.cat = b.dataset.cat; S.catalogQ = ''; go('roadmaps') }); document.querySelectorAll('[data-br]').forEach(b => b.onclick = () => toggleRoad(b.dataset.br)); document.querySelectorAll('[data-bt]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleBookTopic(b.dataset.bt) }); document.querySelectorAll('[data-topic]').forEach(b => b.onchange = () => toggleTopic(b.dataset.topic, b.checked)); document.querySelectorAll('[data-info]').forEach(b => b.onclick = () => showInfo(b.dataset.info)); document.querySelectorAll('[data-modalDone]').forEach(b => b.onclick = () => { let [r, t] = roadmapByTopic(b.dataset.modaldone); toggleTopic(b.dataset.modaldone, !done(r).includes(t.id)); closeOverlay() }); document.querySelectorAll('[data-collapse]').forEach(b => b.onclick = () => { S.collapsed[b.dataset.collapse] = !S.collapsed[b.dataset.collapse]; render() }); document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render() }); document.querySelectorAll('[data-compare]').forEach(b => b.onclick = () => { if (!S.compare.includes(b.dataset.compare)) { if (S.compare.length === 3) S.compare.shift(); S.compare.push(b.dataset.compare) } go('compare') }); document.querySelectorAll('[data-rcompare]').forEach(b => b.onclick = () => { S.compare = S.compare.filter(x => x !== b.dataset.rcompare); render() }); document.querySelectorAll('[data-btab]').forEach(b => b.onclick = () => { S.btab = b.dataset.btab; render() });
                let cq = document.querySelector('#catalogQ'); cq?.addEventListener('input', () => { S.catalogQ = cq.value; let x = filterRoads(); document.querySelector('#catalogGrid').innerHTML = x.length ? x.map(card).join('') : '<div class="empty">No roadmaps match your search.</div>'; document.querySelector('#resultCount').textContent = x.length + ' roadmaps'; wireCards(document.querySelector('#catalogGrid')) });[['diff', 'diff'], ['rtype', 'type'], ['sort', 'sort']].forEach(([id, k]) => document.querySelector('#' + id)?.addEventListener('change', e => { S[k] = e.target.value; render() })); document.querySelector('#roadQ')?.addEventListener('input', e => { S.q = e.target.value; document.querySelector('#roadBody').innerHTML = stagesHTML(get(S.route.split('/')[1])); wireRoadContent(document.querySelector('#roadBody')) }); document.querySelector('#topicFilter')?.addEventListener('change', e => { S.filter = e.target.value; render() }); document.querySelector('#view')?.addEventListener('click', () => { S.view = S.view === 'timeline' ? 'checklist' : 'timeline'; localStorage.setItem('pathforge_view', JSON.stringify(S.view)); render() }); document.querySelector('#collapse')?.addEventListener('click', () => { get(S.route.split('/')[1]).stages.forEach(s => S.collapsed[s.id] = true); render() }); document.querySelector('#expand')?.addEventListener('click', () => { get(S.route.split('/')[1]).stages.forEach(s => S.collapsed[s.id] = false); render() }); document.querySelector('#resetRoad')?.addEventListener('click', () => { delete S.progress[S.route.split('/')[1]]; save(); toast('Roadmap progress reset'); render() }); document.querySelector('#share')?.addEventListener('click', share); document.querySelector('#startRoad')?.addEventListener('click', () => { let r = get(S.route.split('/')[1]), next = r.stages.flatMap(st => st.topics).find(t => t.importance === 'required' && !done(r).includes(t.id)); if (next) { let el = [...document.querySelectorAll('[data-topic]')].find(x => x.dataset.topic === r.id + '|' + next.id); el?.scrollIntoView({ behavior: 'smooth', block: 'center' }); el?.focus() } else toast('Roadmap complete') }); document.querySelector('#startRoad')?.addEventListener('click', () => { let r = get(S.route.split('/')[1]), next = r.stages.flatMap(st => st.topics).find(t => t.importance === 'required' && !done(r).includes(t.id)); if (next) { let el = [...document.querySelectorAll('[data-topic]')].find(x => x.dataset.topic === r.id + '|' + next.id); el?.scrollIntoView({ behavior: 'smooth', block: 'center' }); el?.focus() } else toast('Roadmap complete') }); document.querySelector('#makePlan')?.addEventListener('click', () => { let d = document.querySelector('#duration').value, w = { '30 Days': 4, '60 Days': 8, '90 Days': 13, '6 Months': 26 }[d]; S.plans[S.route.split('/')[1]] = { duration: d, weeks: w }; save(); toast('Study plan saved'); render() }); document.querySelector('#psort')?.addEventListener('change', e => { S.psort = e.target.value; render() }); document.querySelector('#clearRecent')?.addEventListener('click', () => { S.recent = []; localStorage.setItem('pathforge_recent', '[]'); render() }); document.querySelector('#pcat')?.addEventListener('change', filterProjects); document.querySelector('#plevel')?.addEventListener('change', filterProjects); document.querySelector('#compareAdd')?.addEventListener('change', e => { if (e.target.value && S.compare.length < 3) S.compare.push(e.target.value); render() }); document.querySelector('#compareClear')?.addEventListener('click', () => { S.compare = []; render() }); document.querySelector('#exploreStart')?.addEventListener('click', explorer); document.querySelectorAll('[data-stage-scroll]').forEach(b => b.onclick = () => document.getElementById(b.dataset.stageScroll)?.scrollIntoView({ behavior: 'smooth', block: 'start' })); document.querySelectorAll('[data-info]').forEach(b => b.onclick = () => showInfo(b.dataset.info))
            }
            function wireCards(root) { root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => open(b.dataset.open)); root.querySelectorAll('[data-br]').forEach(b => b.onclick = () => toggleRoad(b.dataset.br)); root.querySelectorAll('[data-compare]').forEach(b => b.onclick = () => { if (!S.compare.includes(b.dataset.compare)) { if (S.compare.length === 3) S.compare.shift(); S.compare.push(b.dataset.compare) } go('compare') }) }
            function wireRoadContent(root) { root.querySelectorAll('[data-topic]').forEach(b => b.onchange = () => toggleTopic(b.dataset.topic, b.checked)); root.querySelectorAll('[data-info]').forEach(b => b.onclick = () => showInfo(b.dataset.info)); root.querySelectorAll('[data-bt]').forEach(b => b.onclick = () => toggleBookTopic(b.dataset.bt)); root.querySelectorAll('[data-collapse]').forEach(b => b.onclick = () => { S.collapsed[b.dataset.collapse] = !S.collapsed[b.dataset.collapse]; render() }) }
            function openMore() { document.querySelector('#overlay').innerHTML = `<div class="palette-back" data-dismiss><section class="palette more-sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><h2>More</h2><button data-go="projects">${svgIcon('projects', 20)} Projects</button><button data-go="compare">${svgIcon('compare', 20)} Compare roadmaps</button><button data-go="studyplans">${svgIcon('calendar', 20)} Study plans</button><button id="moreFind">${svgIcon('target', 20)} Find my path</button><button id="moreTheme">${svgIcon(S.theme === 'dark' ? 'sun' : 'moon', 20)} Switch to ${S.theme === 'dark' ? 'light' : 'dark'} theme</button><button id="moreReset">${svgIcon('reset', 20)} Reset local data</button></section></div>`; document.querySelector('#moreFind').onclick = () => { closeOverlay(); explorer() }; document.querySelector('#moreTheme').onclick = () => { closeOverlay(); theme() }; document.querySelector('#moreReset').onclick = () => { closeOverlay(); resetAll() }; document.querySelectorAll('.more-sheet [data-go]').forEach(b => b.onclick = () => { let r = b.dataset.go; closeOverlay(); go(r) }) } function filterProjects() { let c = document.querySelector('#pcat').value, l = document.querySelector('#plevel').value; document.querySelectorAll('.project-item').forEach(x => x.classList.toggle('hidden', (c !== 'All fields' && x.dataset.cat !== c) || (l !== 'All levels' && x.dataset.level !== l))) } function share() { let u = location.href; if (navigator.clipboard?.writeText) navigator.clipboard.writeText(u).then(() => toast('Roadmap link copied')).catch(() => copy(u)); else copy(u) } function copy(t) { let x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); toast('Roadmap link copied') }
            function explorer() { let area = '', goal = ''; function show(step) { let choices = step === 'area' ? ['Software', 'AI/Data', 'Civil/Construction', 'Electrical/Power', 'Electronics', 'Machines/Manufacturing', 'Aerospace', 'Biology/Medical', 'Unsure'] : ['College Learning', 'Job Preparation', 'Skill Development', 'Career Switch', 'Competitive Exam']; document.querySelector('#overlay').innerHTML = `<div class="overlay" data-dismiss><section class="drawer" role="dialog" aria-modal="true"><div class="drawerhead"><div><span class="pill">STEP ${step === 'area' ? '1' : '2'} OF 2</span><h2>${step === 'area' ? 'Which area interests you?' : 'What is your goal?'}</h2><p class="desc">Choose the closest match. You can change it later.</p></div><button class="close" data-dismiss aria-label="Close">×</button></div><div class="explore-options">${choices.map(x => `<button class="btn" data-choice="${esc(x)}">${esc(x)} ${svgIcon('chevron', 16)}</button>`).join('')}</div>${step === 'goal' ? '<button class="link" id="exploreBack">← Change area</button>' : ''}</section></div>`; document.querySelectorAll('[data-choice]').forEach(b => b.onclick = () => { if (step === 'area') { area = b.dataset.choice; show('goal') } else { goal = b.dataset.choice; showResults() } }); document.querySelector('#exploreBack')?.addEventListener('click', () => show('area')) } function showResults() { let picks = area === 'Software' ? ['Computer Science Fundamentals', 'Frontend Developer', 'Data Structures & Algorithms', 'Backend Developer'] : area === 'AI/Data' ? ['Python for Data Analysis', 'Data Analyst', 'Machine Learning', 'Artificial Intelligence Fundamentals'] : area === 'Civil/Construction' ? ['Civil Engineering Fundamentals', 'Structural Engineering', 'Construction Project Management', 'BIM'] : area === 'Electrical/Power' ? ['Electrical Engineering Fundamentals', 'Power Systems', 'Renewable Energy', 'Control Systems'] : area === 'Electronics' ? ['Electronics Engineering Fundamentals', 'Embedded Systems', 'VLSI', 'Digital Electronics'] : area === 'Machines/Manufacturing' ? ['Mechanical Engineering Fundamentals', 'Machine Design', 'Manufacturing Engineering', 'CAD'] : area === 'Aerospace' ? ['Aerospace Engineering Fundamentals', 'Aerodynamics', 'Aircraft Design'] : area === 'Biology/Medical' ? ['Biomedical Engineering', 'Medical Instrumentation', 'Bioinformatics'] : ['Computer Science Fundamentals', 'Civil Engineering Fundamentals', 'Electrical Engineering Fundamentals', 'Mechanical Engineering Fundamentals']; if (goal === 'Competitive Exam') picks = ['GATE CSE', 'Engineering Mathematics', 'Engineering Aptitude']; let rec = picks.map(t => roads.find(r => r.title === t)).filter(Boolean); document.querySelector('#overlay').innerHTML = `<div class="overlay" data-dismiss><section class="drawer" role="dialog" aria-modal="true"><div class="drawerhead"><div><h2>Your suggested starting points</h2><p class="desc">${esc(area)} · ${esc(goal)}</p></div><button class="close" data-dismiss aria-label="Close">×</button></div><div class="grid">${rec.map(card).join('')}</div></section></div>`; wireCards(document.querySelector('#overlay')) } show('area') } function resetAll() { if (confirm('Reset all PathForge progress, bookmarks, history, plans and activity on this device?')) { ['pathforge_progress', 'pathforge_bookmarks', 'pathforge_recent', 'pathforge_study_plans', 'pathforge_activity'].forEach(k => localStorage.removeItem(k)); S.progress = {}; S.book = { roads: [], topics: [] }; S.recent = []; S.plans = {}; S.activity = []; toast('Progress reset'); render() } } function theme() { S.theme = S.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('pathforge_theme', JSON.stringify(S.theme)); render() }
            document.querySelector('#theme').onclick = theme; document.querySelector('#themeMini').onclick = theme; document.querySelector('#commandTrigger').onclick = () => openPalette(false); document.querySelector('#mobileSearch').onclick = () => openPalette(true); document.querySelector('#moreButton').onclick = openMore; document.querySelector('#findPath').onclick = explorer; document.querySelector('#settings').onclick = () => document.querySelector('#settingsPop').classList.toggle('hidden'); document.querySelector('#settingsReset').onclick = resetAll; document.querySelector('#sideReset').onclick = resetAll; document.querySelector('#footerReset').onclick = resetAll; document.querySelector('#collapseSide').onclick = () => { localStorage.setItem('pathforge_sidebar_collapsed', JSON.stringify(!safe('pathforge_sidebar_collapsed', false))); updateShell() }; document.querySelector('#fieldsToggle').onclick = () => document.querySelector('#sideFields').classList.toggle('hidden'); document.querySelector('#mobileBack').onclick = () => go('home'); document.querySelector('#bookmarkCount').onclick = () => go('bookmarks'); document.querySelector('#overlay').addEventListener('click', e => { if (e.target.matches('[data-dismiss]')) closeOverlay() }); document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); if (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) && e.key === '/') return; e.preventDefault(); openPalette(false) } }); document.addEventListener('click', e => { if (!e.target.closest('#settings') && !e.target.closest('#settingsPop')) document.querySelector('#settingsPop').classList.add('hidden') }); window.matchMedia('(max-width: 1023px)').addEventListener?.('change', () => updateShell());
